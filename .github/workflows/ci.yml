# 푸시와 PR마다 저장소 구성, 엔진, 앱을 검사한다. 보호 규칙의 필수 검사는 마지막의 ci-passed다(PR 제목·가지·판 번호는 pr-meta.yml).
# 아껴 돌린다: 같은 가지의 앞 실행은 취소하고, PR에서 바뀐 경로에 닿지 않는 무거운 작업(엔진, 앱, macOS)은 건너뛴다.
name: CI

on:
  push:
    branches: [main, develop]
  # 제목·본문만 고친 것(edited)으로는 돌지 않는다. 그 검사는 pr-meta.yml이 한다.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.2
  # 러너의 디스크가 작다. 증분 빌드 자료와 시험 빌드의 디버그 정보를 만들지 않는다.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 저장소에 두면 안 되는 것
        # 최상위 구성, 비밀 모양, 기기 경로, 개발 도구의 설정 파일.
        run: python3 app/scripts/public_check.py
      - name: 문서의 상대 링크
        run: python3 app/scripts/check_links.py

  changes:
    name: changes
    # 무거운 작업을 돌릴지 정한다. PR은 대상 가지와의 차이로 보고, main·develop에 밀 때와 알 수 없을 때는 모두 돌린다.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.paths.outputs.engine }}
      app: ${{ steps.paths.outputs.app }}
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 바뀐 경로
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          all() { for k in engine app macos; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          [ "${{ github.event_name }}" = pull_request ] && [ -n "$BASE" ] || all
          files=$(git diff --name-only "$BASE" HEAD) || all
          printf '%s\n' "$files"
          # 워크플로가 바뀌면 모두 돈다.
          if printf '%s\n' "$files" | grep -q '^\.github/workflows/'; then all; fi
          has() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          echo "engine=$(has '^app/engine/|^Docs/architecture/knowledge-pack\.md$|^app/scripts/pack_check\.py$')" >> "$GITHUB_OUTPUT"
          echo "app=$(has '^app/')" >> "$GITHUB_OUTPUT"
          echo "macos=$(has '^app/|^Docs/THIRD_PARTY_LICENSES\.md$')" >> "$GITHUB_OUTPUT"

  engine:
    name: engine
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 필요한 도구
        run: |
          sudo apt-get update
          # kari-ai가 OpenSSL을 링크한다(ureq의 native-tls).
          # kari-render의 Skia가 Linux에서 FreeType과 fontconfig를 링크한다.
          # kari-pdf의 시험이 만든 PDF를 poppler(pdftotext, pdffonts, pdfinfo)와 qpdf로 검사한다.
          sudo apt-get install -y libssl-dev pkg-config libfreetype6-dev libfontconfig1-dev poppler-utils qpdf
          rustup update stable
          rustup component add rustfmt clippy
      - name: Cargo 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/engine/target
          key: engine-${{ runner.os }}-${{ hashFiles('app/engine/Cargo.lock', 'app/engine/rust-toolchain.toml') }}
          restore-keys: engine-${{ runner.os }}-
      - name: 형식, 정적 분석, 시험
        working-directory: app/engine
        # kari-store의 강제 종료 시험은 기본 횟수(20번)로 돈다. 200번은 KARI_CRASH_RUNS=200.
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          df -h . | tail -1
      - name: 지식 팩과 그 문서의 표
        run: |
          python3 app/scripts/pack_check.py
          python3 app/scripts/pack_check.py --doc Docs/architecture/knowledge-pack.md

  app:
    name: app
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 필요한 도구
        # flutter test가 빌드 훅(app/hook/build.dart)으로 엔진 라이브러리(kari-ffi)를 cargo로 빌드한다.
        # 통합 시험(test/native_test.dart)이 그 라이브러리를 부른다.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfreetype6-dev libfontconfig1-dev
          rustup update stable
      - name: Cargo 내려받기 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-dl-${{ runner.os }}-${{ hashFiles('app/engine/Cargo.lock') }}
          restore-keys: cargo-dl-${{ runner.os }}-
      - name: 정적 분석과 시험
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  macos:
    name: macos
    # macOS 앱이 컴파일되는지 본다(Swift, 권한 파일, 빌드 훅의 엔진 빌드). 공개 저장소에서만 돈다.
    needs: changes
    if: github.event.repository.private == false && needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 필요한 도구
        run: rustup update stable
      - name: Cargo 내려받기 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-dl-${{ runner.os }}-${{ hashFiles('app/engine/Cargo.lock') }}
          restore-keys: cargo-dl-${{ runner.os }}-
      - name: 디버그 빌드
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --debug
      - name: 제3자 고지가 의존성과 맞는지
        run: python3 app/scripts/third_party.py --check

  ci-passed:
    name: ci-passed
    if: always()
    needs: [repo, changes, engine, app, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 검사 통과
        run: |
          # 하나씩 본다(&&로 이으면 가운데 것이 실패해도 셸이 멈추지 않는다).
          for result in "${{ needs.repo.result }}" "${{ needs.changes.result }}"; do
            [ "$result" = success ] || exit 1
          done
          # 무거운 작업은 바뀐 경로에 닿지 않아 건너뛴 것만 통과로 본다(changes가 성공했을 때만 여기 온다).
          ok() { case "$1" in success) ;; skipped) [ "$2" != true ] || exit 1 ;; *) exit 1 ;; esac; }
          ok "${{ needs.engine.result }}" "${{ needs.changes.outputs.engine }}"
          ok "${{ needs.app.result }}" "${{ needs.changes.outputs.app }}"
          # macos는 비공개 저장소에서도 건너뛴다.
          if [ "${{ github.event.repository.private }}" = true ]; then
            case "${{ needs.macos.result }}" in success|skipped) ;; *) exit 1 ;; esac
          else
            ok "${{ needs.macos.result }}" "${{ needs.changes.outputs.macos }}"
          fi
