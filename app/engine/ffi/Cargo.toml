[package]
name = "kari-ffi"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "kari"
crate-type = ["cdylib", "rlib"]

[dependencies]
kari-doc = { path = "../doc" }
kari-store = { path = "../store" }
kari-layout = { path = "../layout" }
kari-edit = { path = "../edit" }
kari-render = { path = "../render" }
kari-pdf = { path = "../pdf" }
kari-docx = { path = "../docx" }
kari-import = { path = "../import" }
kari-ai = { path = "../ai" }
kari-interview = { path = "../interview" }
# 가져오기: 미리 보기가 읽은 파일과 적용이 읽은 파일이 같은지 본다.
sha2 = "0.11"

# 시험이 쓰는 PDF 도우미(앱에서는 앱의 실행 파일이 `kari_pdf_helper`를 부른다). 앱 빌드(`--lib`)에는 들지 않는다.
[[bin]]
name = "kari-pdf-helper"
path = "src/bin/pdf_helper.rs"
test = false
doc = false

[features]
# 앱에 싣는 빌드(app/hook/build.dart가 켠다): PDF 도우미로 돌 때 힙 상한을 세는 전역 할당자를 둔다.
app = []
# 시험용 길: `ai.testBase`(가짜 서버 주소)와 메모리 키 보관. 앱에 싣는 기본 빌드에는 없다.
test-hooks = []

[dev-dependencies]
# 시험에서 다른 연결로 DB 쓰기 잠금을 잡아 커밋이 디스크를 기다리게 만든다. kari-store와 같은 판이다.
rusqlite = { version = "0.43", features = ["bundled"] }
# 가짜 HTTP 서버(app/engine/ai/tests/common)를 같이 쓴다. 가짜 인증 서버의 ID 토큰 서명에 뒤의 셋을 쓴다.
serde_json = "1"
num-bigint = "0.4"
base64 = "0.22"
# PDF 가져오기 시험이 자식 프로세스의 최대 RSS를 잰다(getrusage). 이미 쓰는 판이라 새로 빌드되는 것은 없다.
libc = "0.2"
