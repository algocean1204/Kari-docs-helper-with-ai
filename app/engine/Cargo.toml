# 엔진 Rust 작업 공간.
[workspace]
members = ["doc", "store", "ai", "layout", "edit", "render", "pdf", "interview", "ffi", "docx"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[profile.release]
opt-level = 3

# 앱에 싣는 엔진 라이브러리(app/hook/build.dart가 쓴다). 전체 링크 최적화와 기호 지우기로 용량을 줄인다.
# release에 두지 않는 까닭: 시험 실행 파일마다 전체 링크 최적화를 하면 시험이 느려진다.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
