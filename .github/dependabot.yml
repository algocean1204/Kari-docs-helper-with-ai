# 주마다 의존성 갱신 PR을 연다. 같은 종류는 한 PR로 묶는다. 제목은 PR 제목 규칙(.github/CONTRIBUTING.md)에 맞춘다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /app/engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      pub:
        patterns: ["*"]
        update-types: [minor, patch]
