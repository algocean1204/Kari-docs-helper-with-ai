# 푸시와 PR마다 저장소 구성, 엔진, 앱을 검사한다. 보호 규칙의 필수 검사는 마지막의 ci-passed 하나다.
name: CI

on:
  push:
    branches: [main, develop]
  # edited: 제목이나 본문을 고친 뒤 pr 작업이 다시 보게 한다(다른 작업도 다시 돈다).
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.2
  # 러너의 디스크가 작다. 증분 빌드 자료와 시험 빌드의 디버그 정보를 만들지 않는다.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 저장소에 두면 안 되는 것
        # 최상위 구성, 비밀 모양, 기기 경로, 개발 도구의 설정 파일.
        run: python3 app/scripts/public_check.py
      - name: 문서의 상대 링크
        run: python3 app/scripts/check_links.py

  pr:
    name: pr
    # 스쿼시 병합의 커밋 제목이 되는 PR 제목, 가지 이름, 연결 이슈를 본다. 바깥 액션 없이 셸로만 한다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # 글자 수(한글 한 자 = 1)로 세려면 UTF-8 로케일이 필요하다.
      LC_ALL: C.UTF-8
      # 글은 환경 변수로만 받는다. 셸 줄에 직접 끼우면 제목의 글자가 명령이 된다.
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_BASE: ${{ github.event.pull_request.base.ref }}
      PR_ASSOC: ${{ github.event.pull_request.author_association }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: 제목, 가지 이름, 연결 이슈
        run: |
          types='feat|fix|docs|test|refactor|perf|build|ci|chore|revert'
          title_re="^($types)(\([a-z0-9-]+\))?!?: .{1,72}$"
          branch_re="^($types)/[a-z0-9][a-z0-9._-]*$"
          issue_re='(Fixes|Closes|Resolves|Refs) #[0-9]+'
          fail=0
          probe=가
          if [ "${#probe}" != 1 ]; then
            echo "::error::러너의 로케일이 UTF-8이 아니라 제목의 글자 수를 셀 수 없습니다"
            exit 1
          fi
          if ! [[ "$PR_TITLE" =~ $title_re ]]; then
            echo "::error title=PR 제목::제목을 'type(scope): 설명' 꼴로 고쳐 주세요. type은 feat, fix, docs, test, refactor, perf, build, ci, chore, revert 중 하나, scope는 소문자·숫자·하이픈이고 생략할 수 있으며, 호환이 깨지면 콜론 앞에 !를 붙입니다. 설명은 1자 이상 72자 이하입니다. 예: fix(layout): 머리 행이 다음 쪽에서 빠지는 문제를 고침. 제목은 PR 화면에서 고치면 검사가 다시 돕니다(.github/CONTRIBUTING.md)"
            fail=1
          fi
          # main에는 develop에서만 간다(작업 가지 → develop → main).
          if [ "$PR_BASE" = main ] && [ "$PR_BRANCH" != develop ]; then
            echo "::error title=대상 가지::PR의 대상(base)을 develop으로 바꿔 주세요. main에는 develop에서만 병합합니다(.github/CONTRIBUTING.md)"
            fail=1
          fi
          case "$PR_BRANCH" in
            dependabot/*) ;;
            develop) [ "$PR_BASE" = main ] || { echo "::error title=가지 이름::develop은 main으로 가는 PR에서만 씁니다"; fail=1; } ;;
            *)
              if ! [[ "$PR_BRANCH" =~ $branch_re ]]; then
                echo "::error title=가지 이름::가지 이름을 '<type>/<짧은-주제>'로 지어 주세요. type은 feat, fix, docs, test, refactor, perf, build, ci, chore, revert 중 하나이고 주제는 소문자, 숫자, 하이픈입니다. 예: fix/table-header-repeat. 가지를 새로 만들어 PR을 다시 열어 주세요(.github/CONTRIBUTING.md)"
                fail=1
              fi
              ;;
          esac
          case "$PR_ASSOC" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *)
              # 의존성 도구가 여는 PR에는 이슈가 없다.
              if [ "$PR_AUTHOR" != 'dependabot[bot]' ] && ! [[ "$PR_BODY" =~ $issue_re ]]; then
                echo "::error title=연결 이슈::본문에 연결 이슈를 'Fixes #번호'(Closes, Resolves, Refs도 됩니다) 꼴로 적어 주세요. 연결된 이슈가 없는 외부 PR은 검토하지 않습니다(.github/CONTRIBUTING.md)"
                fail=1
              fi
              ;;
          esac
          exit "$fail"

  engine:
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 필요한 도구
        run: |
          sudo apt-get update
          # kari-ai가 OpenSSL을 링크한다(ureq의 native-tls).
          # kari-render의 Skia가 Linux에서 FreeType과 fontconfig를 링크한다.
          # kari-pdf의 시험이 만든 PDF를 poppler(pdftotext, pdffonts, pdfinfo)와 qpdf로 검사한다.
          sudo apt-get install -y libssl-dev pkg-config libfreetype6-dev libfontconfig1-dev poppler-utils qpdf
          rustup update stable
          rustup component add rustfmt clippy
      - name: 형식, 정적 분석, 시험
        working-directory: app/engine
        # kari-store의 강제 종료 시험은 기본 횟수(20번)로 돈다. 200번은 KARI_CRASH_RUNS=200.
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          df -h . | tail -1
      - name: 지식 팩과 그 문서의 표
        run: |
          python3 app/scripts/pack_check.py
          python3 app/scripts/pack_check.py --doc Docs/architecture/knowledge-pack.md

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 필요한 도구
        # flutter test가 빌드 훅(app/hook/build.dart)으로 엔진 라이브러리(kari-ffi)를 cargo로 빌드한다.
        # 통합 시험(test/native_test.dart)이 그 라이브러리를 부른다.
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libfreetype6-dev libfontconfig1-dev
          rustup update stable
      - name: 정적 분석과 시험
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

  macos:
    name: macos
    # macOS 앱이 컴파일되는지 본다(Swift, 권한 파일, 빌드 훅의 엔진 빌드). 공개 저장소에서만 돈다.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: 필요한 도구
        run: rustup update stable
      - name: 디버그 빌드
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --debug
      - name: 제3자 고지가 의존성과 맞는지
        run: python3 app/scripts/third_party.py --check

  ci-passed:
    name: ci-passed
    if: always()
    needs: [repo, engine, app, macos, pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 모든 검사 통과
        run: |
          # 하나씩 본다(&&로 이으면 가운데 것이 실패해도 셸이 멈추지 않는다).
          for result in "${{ needs.repo.result }}" "${{ needs.engine.result }}" "${{ needs.app.result }}"; do
            [ "$result" = success ] || exit 1
          done
          # macos는 비공개 저장소에서 건너뛴다.
          case "${{ needs.macos.result }}" in success|skipped) ;; *) exit 1 ;; esac
          # pr은 PR에서만 돈다. push(main)에서 건너뛴 것만 통과로 본다.
          case "${{ needs.pr.result }}" in
            success) ;;
            skipped) [ "${{ github.event_name }}" = push ] || exit 1 ;;
            *) exit 1 ;;
          esac
