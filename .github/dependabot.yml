# 주마다 의존성 갱신 PR을 연다. 같은 종류는 한 PR로 묶는다. 제목은 PR 제목 규칙(.github/CONTRIBUTING.md)에 맞춘다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /app/engine
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # 엔진이 직접 쓰는 read-fonts는 글자 배치 라이브러리(parley의 fontique, harfrust)와 같은 판에 맞춰 판을 하나 더 늘리지 않는다.
      # 다른 판으로 올리는 것은 parley를 올릴 때 함께 한다. 같은 판 안의 고침(patch)은 받는다.
      - dependency-name: read-fonts
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: pub
    directory: /app
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      pub:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # hooks의 큰 판은 Flutter SDK가 고정한 의존성(meta)과 맞지 않을 수 있다. 큰 판은 SDK를 올릴 때 함께 올린다.
      - dependency-name: hooks
        update-types: ["version-update:semver-major"]
