name: 기능 제안
description: 있었으면 하는 기능이나 바뀌었으면 하는 동작
title: "[기능]: "
labels: ["enhancement", "untriaged"]
body:
  - type: markdown
    attributes:
      value: 한국어로 써 주세요. 영어도 받습니다.
  - type: textarea
    id: problem
    attributes:
      label: 무엇을 하려는데 무엇이 모자란가요
      placeholder: 예) 표의 칸에 대각선을 긋고 싶다
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 바라는 동작
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 지금 쓰는 우회 방법이나 참고할 앱
